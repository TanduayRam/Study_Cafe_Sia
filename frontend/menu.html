<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Cafe - Menu</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
    <div class="sidebar" id="menu"></div>
    <div class="main">
        <div class="topbar">
            <h1>Menu</h1>
            <div class="who" id="who"></div>
        </div>
        <div id="banner"></div>
        <div id="content">
<div class="card" id="formCard">
    <h2 id="formTitle">Add a menu item</h2>
    <div class="row">
        <div><label>Item name</label><input id="nameInput"></div>
        <div><label>Category</label><input id="categoryInput"></div>
        <div><label>Price (pesos)</label><input id="priceInput" type="number" step="any"></div>
        <div><label>Stock</label><input id="stockInput" type="number"></div>
        <div><label>Reorder level</label><input id="reorderInput" type="number" value="5"></div>
    </div>
    <div style="margin-top:12px">
        <button class="btn primary" onclick="saveItem()">Save</button>
        <button class="btn" onclick="clearForm()">Clear</button>
    </div>
</div>

<div class="card">
    <h2>Food, drinks and supplies</h2>
    <div class="tablewrap">
        <table>
            <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Reorder at</th><th>Stock status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
var items = [];
var editingId = null;
var role = '';

async function loadItems() {
    try {
        showLoading();
        var result = await callApi('/menu-items');
        items = result.data;

        var html = '';
        for (var i = 0; i < items.length; i++) {
            var m = items[i];

            var stockStatus = '<span class="badge b-green">OK</span>';
            if (m.low_stock) {
                stockStatus = '<span class="badge b-red">Low stock</span>';
            }

            var buttons = '';
            if (role === 'Admin' || role === 'Staff') {
                buttons = '<button class="btn small" onclick="editItem(' + m.item_id + ')">Edit</button> ';
            }
            if (role === 'Admin') {
                buttons = buttons + '<button class="btn small danger" onclick="deleteItem(' + m.item_id + ')">Delete</button>';
            }

            html = html + '<tr>' +
                '<td>' + m.item_id + '</td>' +
                '<td>' + escapeHtml(m.name) + '</td>' +
                '<td>' + escapeHtml(m.category) + '</td>' +
                '<td>' + formatMoney(m.price) + '</td>' +
                '<td>' + m.stock + '</td>' +
                '<td>' + m.reorder_level + '</td>' +
                '<td>' + stockStatus + '</td>' +
                '<td class="actions">' + buttons + '</td></tr>';
        }
        if (items.length === 0) {
            html = '<tr><td colspan="8" class="empty">No menu items found.</td></tr>';
        }
        document.getElementById('rows').innerHTML = html;
        hideBanner();
    } catch (error) {
        showError(error.message);
    }
}

function clearForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = 'Add a menu item';
    document.getElementById('nameInput').value = '';
    document.getElementById('categoryInput').value = '';
    document.getElementById('priceInput').value = '';
    document.getElementById('stockInput').value = '';
    document.getElementById('reorderInput').value = '5';
}

function editItem(id) {
    var m = findById(items, 'item_id', id);
    editingId = id;
    document.getElementById('formTitle').textContent = 'Edit menu item #' + id;
    document.getElementById('nameInput').value = m.name;
    document.getElementById('categoryInput').value = m.category;
    document.getElementById('priceInput').value = m.price;
    document.getElementById('stockInput').value = m.stock;
    document.getElementById('reorderInput').value = m.reorder_level;
    window.scrollTo(0, 0);
}

async function saveItem() {
    try {
        var body = {
            name: document.getElementById('nameInput').value,
            category: document.getElementById('categoryInput').value,
            price: document.getElementById('priceInput').value,
            stock: document.getElementById('stockInput').value,
            reorder_level: document.getElementById('reorderInput').value
        };

        var result;
        if (editingId === null) {
            result = await callApi('/menu-items', 'POST', body);
        } else {
            result = await callApi('/menu-items/' + editingId, 'PUT', body);
        }

        showMessage(result.message, false);
        clearForm();
        loadItems();
    } catch (error) {
        showMessage(error.message, true);
    }
}

async function deleteItem(id) {
    if (confirm('Delete this menu item?') === false) {
        return;
    }
    try {
        var result = await callApi('/menu-items/' + id, 'DELETE');
        showMessage(result.message, false);
        loadItems();
    } catch (error) {
        showMessage(error.message, true);
    }
}

// ---- start the page ----
var currentUser = startPage('menu.html');
if (currentUser) {
    role = currentUser.role;
    if (role === 'Member') {
        document.getElementById('formCard').style.display = 'none';
    }
    loadItems();
}
</script>
</body>
</html>
