 
<!DOCTYPE html>
<html>
<head>
    <title>Study Cafe Menu</title>
</head>
<body>
    <h2>Explore Our Menu</h2>

    <h3>Add something to the menu!</h3>

    <form id="menuForm">
        <input id="name" placeholder="Item Name" required>
        <input id="category" placeholder="Category" required>
        <input id="price" type="number" step="0.01" min="0" placeholder="Price" required>
        <input id="stock" type="number" min="0" placeholder="Stock" required>
        <input id="reorder_level" type="number" min="0" placeholder="Reorder Level" required>

        <button type="submit">Save Item</button>
    </form>

    <p id="status">Preparing your menu... wait lang..ehe.</p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Reorder Level</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <script>
        let editingMenuItemId = null;

        async function loadMenu() {
            const status = document.getElementById('status');
            const list = document.getElementById('list');

            status.textContent = 'Getting your menu ready...';

            try {
                const res = await fetch('/api/menu-items');

                if (!res.ok) {
                    throw new Error('Unable to load menu items.');
                }

                const items = await res.json();

                list.innerHTML = items.map(item => `
                    <tr>
                        <td>${item.menu_item_id}</td>
                        <td>${item.name}</td>
                        <td>${item.category}</td>
                        <td>${item.price}</td>
                        <td>${item.stock}</td>
                        <td>${item.reorder_level}</td>
                        <td>
                            <button onclick="editMenuItem(${item.menu_item_id})">Edit</button>
                            <button onclick="deleteMenuItem(${item.menu_item_id})">Delete</button>
                        </td>
                    </tr>
                `).join('');

                status.textContent = 'Your menu is ready!';

            } catch (error) {
                status.textContent = error.message;
            }
        }

        async function editMenuItem(id) {
            try {
                const res = await fetch('/api/menu-items/' + id);

                if (!res.ok) {
                    throw new Error('Unable to load item details.');
                }

                const item = await res.json();

                document.getElementById('name').value = item.name;
                document.getElementById('category').value = item.category;
                document.getElementById('price').value = item.price;
                document.getElementById('stock').value = item.stock;
                document.getElementById('reorder_level').value = item.reorder_level;

                editingMenuItemId = id;
                document.querySelector('#menuForm button[type="submit"]').textContent = 'Save Changes';

            } catch (error) {
                alert(error.message);
            }
        }

        async function deleteMenuItem(id) {
            if (!confirm('Are you sure you want to remove this menu item?')) {
                return;
            }

            try {
                const res = await fetch('/api/menu-items/' + id, {
                    method: 'DELETE'
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Unable to remove menu item.');
                }

                alert('Menu item removed successfully!');
                loadMenu();

            } catch (error) {
                alert(error.message);
            }
        }

        document.getElementById('menuForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const item = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                stock: document.getElementById('stock').value,
                reorder_level: document.getElementById('reorder_level').value
            };

            const url = editingMenuItemId
                ? '/api/menu-items/' + editingMenuItemId
                : '/api/menu-items';

            const method = editingMenuItemId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(item)
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Unable to save menu item.');
                }

                alert(editingMenuItemId
                    ? 'Your menu item has been updated!'
                    : 'Your new menu item is ready!');

                editingMenuItemId = null;
                document.getElementById('menuForm').reset();
                document.querySelector('#menuForm button[type="submit"]').textContent = 'Save Item';

                loadMenu();

            } catch (error) {
                alert(error.message);
            }
        });

        loadMenu();
    </script>
</body>
</html>
