<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Cafe - Users</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="shell">
        <div class="sidebar" id="menu"></div>
        <div class="main">
            <div class="topbar">
                <h1>Users</h1>
                <div class="who" id="who"></div>
            </div>
            <div id="banner"></div>
            <div id="content">
                <div class="card">
                    <h2 id="formTitle">Add a user</h2>
                    <div class="row">
                        <div><label>Full name</label><input id="nameInput"></div>
                        <div><label>Email</label><input id="emailInput" type="email"></div>
                        <div><label>Password (8+ characters)</label><input id="passwordInput" type="password"></div>
                        <div><label>Role</label><select id="roleSelect"></select></div>
                    </div>
                    <label><input type="checkbox" id="activeInput" style="width:auto" checked> Account is active</label>
                    <div style="margin-top:12px">
                        <button class="btn primary" onclick="saveUser()">Save</button>
                        <button class="btn" onclick="clearForm()">Clear</button>
                    </div>
                </div>

                <div class="card">
                    <h2>All users</h2>
                    <div class="tablewrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Active</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        var users = []; // the list shown in the table
        var editingId = null; // null = we are adding, a number = we are editing that user

        // Fill the Role dropdown from the API.
        async function loadRoles() {
            var result = await callApi('/roles');
            var html = '';
            for (var i = 0; i < result.data.length; i++) {
                html = html + '<option value="' + result.data[i].role_id + '">' + escapeHtml(result.data[i].name) + '</option>';
            }
            document.getElementById('roleSelect').innerHTML = html;
        }

        // Get all users and draw the table.
        async function loadUsers() {
            try {
                showLoading();
                var result = await callApi('/users');
                users = result.data;

                var html = '';
                for (var i = 0; i < users.length; i++) {
                    var u = users[i];
                    var activeText = '<span class="badge b-grey">Deactivated</span>';
                    if (u.is_active) {
                        activeText = '<span class="badge b-green">Yes</span>';
                    }
                    html = html + '<tr>' +
                        '<td>' + u.user_id + '</td>' +
                        '<td>' + escapeHtml(u.name) + '</td>' +
                        '<td>' + escapeHtml(u.email) + '</td>' +
                        '<td>' + badge(u.role) + '</td>' +
                        '<td>' + activeText + '</td>' +
                        '<td class="actions">' +
                        '<button class="btn small" onclick="editUser(' + u.user_id + ')">Edit</button> ' +
                        '<button class="btn small danger" onclick="deleteUser(' + u.user_id + ')">Delete</button>' +
                        '</td></tr>';
                }
                if (users.length === 0) {
                    html = '<tr><td colspan="6" class="empty">No users found.</td></tr>';
                }
                document.getElementById('rows').innerHTML = html;
                hideBanner();
            } catch (error) {
                showError(error.message);
            }
        }

        // Empty the form and go back to "add" mode.
        function clearForm() {
            editingId = null;
            document.getElementById('formTitle').textContent = 'Add a user';
            document.getElementById('nameInput').value = '';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('activeInput').checked = true;
        }

        // Put a user's values in the form so they can be changed.
        function editUser(id) {
            var u = findById(users, 'user_id', id);
            editingId = id;
            document.getElementById('formTitle').textContent = 'Edit user #' + id + ' (leave password empty to keep it)';
            document.getElementById('nameInput').value = u.name;
            document.getElementById('emailInput').value = u.email;
            document.getElementById('passwordInput').value = '';
            document.getElementById('roleSelect').value = u.role_id;
            document.getElementById('activeInput').checked = Boolean(u.is_active);
            window.scrollTo(0, 0);
        }

        // Save = POST (new user) or PUT (existing user).
        async function saveUser() {
            try {
                var body = {
                    name: document.getElementById('nameInput').value,
                    email: document.getElementById('emailInput').value,
                    password: document.getElementById('passwordInput').value,
                    role_id: document.getElementById('roleSelect').value,
                    is_active: document.getElementById('activeInput').checked
                };

                var result;
                if (editingId === null) {
                    result = await callApi('/users', 'POST', body);
                } else {
                    result = await callApi('/users/' + editingId, 'PUT', body);
                }

                showMessage(result.message, false);
                clearForm();
                loadUsers();
            } catch (error) {
                showMessage(error.message, true);
            }
        }

        async function deleteUser(id) {
            if (confirm('Delete this user?') === false) {
                return;
            }
            try {
                var result = await callApi('/users/' + id, 'DELETE');
                showMessage(result.message, false);
                loadUsers();
            } catch (error) {
                showMessage(error.message, true);
            }
        }

        // ---- start the page ----
        var currentUser = startPage('users.html');
        if (currentUser) {
            loadRoles().then(function() {
                loadUsers();
            });
        }
    </script>
</body>

</html>
