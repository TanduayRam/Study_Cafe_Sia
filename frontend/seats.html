<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Cafe - Seats</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
    <div class="sidebar" id="menu"></div>
    <div class="main">
        <div class="topbar">
            <h1>Seats</h1>
            <div class="who" id="who"></div>
        </div>
        <div id="banner"></div>
        <div id="content">
<div class="card" id="formCard">
    <h2 id="formTitle">Add a seat</h2>
    <div class="row">
        <div><label>Study zone</label><select id="zoneSelect"></select></div>
        <div><label>Seat label (e.g. Desk 7, Chess Board 3, Booth 6)</label><input id="labelInput"></div>
        <div><label>Status</label>
            <select id="statusSelect"><option>Available</option><option>Occupied</option><option>Maintenance</option></select>
        </div>
    </div>
    <div style="margin-top:12px">
        <button class="btn primary" onclick="saveSeat()">Save</button>
        <button class="btn" onclick="clearForm()">Clear</button>
    </div>
</div>

<div class="card">
    <h2>Seats, tables and booths</h2>
    <div class="tablewrap">
        <table>
            <thead><tr><th>ID</th><th>Label</th><th>Zone</th><th>Rate / hour</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
var seats = [];
var editingId = null;
var role = '';

// Fill the Zone dropdown.
async function loadZoneChoices() {
    var result = await callApi('/study-zones');
    var html = '';
    for (var i = 0; i < result.data.length; i++) {
        html = html + '<option value="' + result.data[i].zone_id + '">' + escapeHtml(result.data[i].name) + '</option>';
    }
    document.getElementById('zoneSelect').innerHTML = html;
}

async function loadSeats() {
    try {
        showLoading();
        var result = await callApi('/seats');
        seats = result.data;

        var html = '';
        for (var i = 0; i < seats.length; i++) {
            var s = seats[i];
            var buttons = '';
            if (role === 'Admin' || role === 'Staff') {
                buttons = '<button class="btn small" onclick="editSeat(' + s.seat_id + ')">Edit</button> ';
            }
            if (role === 'Admin') {
                buttons = buttons + '<button class="btn small danger" onclick="deleteSeat(' + s.seat_id + ')">Delete</button>';
            }
            html = html + '<tr>' +
                '<td>' + s.seat_id + '</td>' +
                '<td>' + escapeHtml(s.label) + '</td>' +
                '<td>' + escapeHtml(s.zone_name) + '</td>' +
                '<td>' + formatMoney(s.hourly_rate) + '</td>' +
                '<td>' + badge(s.status) + '</td>' +
                '<td class="actions">' + buttons + '</td></tr>';
        }
        if (seats.length === 0) {
            html = '<tr><td colspan="6" class="empty">No seats found.</td></tr>';
        }
        document.getElementById('rows').innerHTML = html;
        hideBanner();
    } catch (error) {
        showError(error.message);
    }
}

function clearForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = 'Add a seat';
    document.getElementById('labelInput').value = '';
    document.getElementById('statusSelect').value = 'Available';
}

function editSeat(id) {
    var s = findById(seats, 'seat_id', id);
    editingId = id;
    document.getElementById('formTitle').textContent = 'Edit seat #' + id;
    document.getElementById('zoneSelect').value = s.zone_id;
    document.getElementById('labelInput').value = s.label;
    document.getElementById('statusSelect').value = s.status;
    window.scrollTo(0, 0);
}

// Save = POST (new seat) or PUT (existing seat).
async function saveSeat() {
    try {
        var body = {
            zone_id: document.getElementById('zoneSelect').value,
            label: document.getElementById('labelInput').value,
            status: document.getElementById('statusSelect').value
        };

        var result;
        if (editingId === null) {
            result = await callApi('/seats', 'POST', body);
        } else {
            result = await callApi('/seats/' + editingId, 'PUT', body);
        }

        showMessage(result.message, false);
        clearForm();
        loadSeats();
    } catch (error) {
        showMessage(error.message, true);
    }
}

async function deleteSeat(id) {
    if (confirm('Delete this seat?') === false) {
        return;
    }
    try {
        var result = await callApi('/seats/' + id, 'DELETE');
        showMessage(result.message, false);
        loadSeats();
    } catch (error) {
        showMessage(error.message, true);
    }
}

// ---- start the page ----
var currentUser = startPage('seats.html');
if (currentUser) {
    role = currentUser.role;
    if (role === 'Member') {
        document.getElementById('formCard').style.display = 'none';
    }
    // Staff can edit a seat but only an Admin can add a new one.
    loadZoneChoices().then(function () {
        loadSeats();
    });
}
</script>
</body>
</html>
