 <!DOCTYPE html>
 <html lang="en">
 <head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Study Cafe - Pass Packages</title>
 <link rel="stylesheet" href="app.css">
 </head>
 <body>
 <div class="shell">
    <div class="sidebar" id="menu"></div>
    <div class="main">
        <div class="topbar">
            <h1>Pass Packages</h1>
            <div class="who" id="who"></div>
        </div>
        <div id="banner"></div>
        <div id="content">
<div class="card" id="formCard">
    <h2 id="formTitle">Add a pass package</h2>
    <div class="row">
        <div><label>Package name</label><input id="nameInput"></div>
        <div><label>Hours included</label><input id="hoursInput" type="number" step="any"></div>
        <div><label>Price (pesos)</label><input id="priceInput" type="number" step="any"></div>
        <div><label>Valid for (days)</label><input id="daysInput" type="number"></div>
    </div>
    <label>Description</label>
    <textarea id="descriptionInput" rows="2"></textarea>
    <div style="margin-top:12px">
        <button class="btn primary" onclick="savePackage()">Save</button>
        <button class="btn" onclick="clearForm()">Clear</button>
    </div>
</div>

<div class="card">
    <h2>Prepaid hour packages</h2>
    <div class="tablewrap">
        <table>
            <thead><tr><th>ID</th><th>Name</th><th>Hours</th><th>Price</th><th>Valid (days)</th><th>Description</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
var packages = [];
var editingId = null;
var isAdmin = false;

async function loadPackages() {
    try {
        showLoading();
        var result = await callApi('/pass-packages');
        packages = result.data;

        var html = '';
        for (var i = 0; i < packages.length; i++) {
            var p = packages[i];
            var buttons = '';
            if (isAdmin) {
                buttons = '<button class="btn small" onclick="editPackage(' + p.package_id + ')">Edit</button> ' +
                          '<button class="btn small danger" onclick="deletePackage(' + p.package_id + ')">Delete</button>';
            }
            html = html + '<tr>' +
                '<td>' + p.package_id + '</td>' +
                '<td>' + escapeHtml(p.name) + '</td>' +
                '<td>' + formatNumber(p.hours) + '</td>' +
                '<td>' + formatMoney(p.price) + '</td>' +
                '<td>' + p.validity_days + '</td>' +
                '<td>' + escapeHtml(p.description) + '</td>' +
                '<td class="actions">' + buttons + '</td></tr>';
        }
        if (packages.length === 0) {
            html = '<tr><td colspan="7" class="empty">No pass packages found.</td></tr>';
        }
        document.getElementById('rows').innerHTML = html;
        hideBanner();
    } catch (error) {
        showError(error.message);
    }
}

function clearForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = 'Add a pass package';
    document.getElementById('nameInput').value = '';
    document.getElementById('hoursInput').value = '';
    document.getElementById('priceInput').value = '';
    document.getElementById('daysInput').value = '';
    document.getElementById('descriptionInput').value = '';
}

function editPackage(id) {
    var p = findById(packages, 'package_id', id);
    editingId = id;
    document.getElementById('formTitle').textContent = 'Edit pass package #' + id;
    document.getElementById('nameInput').value = p.name;
    document.getElementById('hoursInput').value = p.hours;
    document.getElementById('priceInput').value = p.price;
    document.getElementById('daysInput').value = p.validity_days;
    document.getElementById('descriptionInput').value = p.description || '';
    window.scrollTo(0, 0);
}

async function savePackage() {
    try {
        var body = {
            name: document.getElementById('nameInput').value,
            hours: document.getElementById('hoursInput').value,
            price: document.getElementById('priceInput').value,
            validity_days: document.getElementById('daysInput').value,
            description: document.getElementById('descriptionInput').value
        };

        var result;
        if (editingId === null) {
            result = await callApi('/pass-packages', 'POST', body);
        } else {
            result = await callApi('/pass-packages/' + editingId, 'PUT', body);
        }

        showMessage(result.message, false);
        clearForm();
        loadPackages();
    } catch (error) {
        showMessage(error.message, true);
    }
}

async function deletePackage(id) {
    if (confirm('Delete this pass package?') === false) {
        return;
    }
    try {
        var result = await callApi('/pass-packages/' + id, 'DELETE');
        showMessage(result.message, false);
        loadPackages();
    } catch (error) {
        showMessage(error.message, true);
    }
}

// ---- start the page ----
var currentUser = startPage('pass_packages.html');
if (currentUser) {
    isAdmin = (currentUser.role === 'Admin');
    if (isAdmin === false) {
        document.getElementById('formCard').style.display = 'none';
    }
    loadPackages();
}
</script>
</body>
 </html>
