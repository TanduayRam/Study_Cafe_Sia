<!DOCTYPE html>
<html>
<head>
    <title>Pass Packages</title>
</head>
<body>
    <h2>Member Pass Packages</h2>
    <h3>Create a Pass Package</h3>

    <form id="packageForm">
        <input id="name" placeholder="Package Name" required>

        <input id="hours" type="number" min="0.01"
            step="0.01" placeholder="Hours" required>

        <input id="price" type="number" min="0.01"
            step="0.01" placeholder="Price" required>

        <input id="validity_days" type="number" min="1"
            step="1" placeholder="Validity Days" required>

        <input id="description" placeholder="Description">

        <button type="submit">Save Package</button>
    </form>

    <p id="status">Loading pass packages...</p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Hours</th>
                <th>Price</th>
                <th>Validity Days</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <script>
        let editingPackageId = null;

        async function loadPackages() {
            const status = document.getElementById('status');
            const list = document.getElementById('list');

            status.textContent = 'Loading pass packages...';

            try {
                const res = await fetch('/api/pass-packages');

                if (!res.ok) {
                    throw new Error('Failed to retrieve pass packages.');
                }

                const response = await res.json();
                const packages = response.data;

                list.innerHTML = packages.map(pkg => `
                    <tr>
                        <td>${pkg.pass_package_id}</td>
                        <td>${pkg.name}</td>
                        <td>${pkg.hours}</td>
                        <td>₱${Number(pkg.price).toFixed(2)}</td>
                        <td>${pkg.validity_days}</td>
                        <td>${pkg.description || ''}</td>
                        <td>
                            <button onclick="editPackage(${pkg.pass_package_id})">
                                Edit
                            </button>
                            <button onclick="deletePackage(${pkg.pass_package_id})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `).join('');

                status.textContent = 'Pass packages loaded successfully!';

            } catch (error) {
                status.textContent = error.message;
            }
        }

        async function editPackage(id) {
            try {
                const res = await fetch('/api/pass-packages/' + id);

                if (!res.ok) {
                    throw new Error('Failed to load pass package.');
                }

                const response = await res.json();
                const pkg = response.data;  

                document.getElementById('name').value = pkg.name;
                document.getElementById('hours').value = pkg.hours;
                document.getElementById('price').value = pkg.price;
                document.getElementById('validity_days').value = pkg.validity_days;
                document.getElementById('description').value = pkg.description || '';

                editingPackageId = id;

                document.querySelector('#packageForm button[type="submit"]')
                    .textContent = 'Save Changes';

            } catch (error) {
                alert(error.message);
            }
        }

        async function deletePackage(id) {
            if (!confirm('Are you sure you want to delete this package?')) {
                return;
            }

            try {
                const res = await fetch('/api/pass-packages/' + id, {
                    method: 'DELETE'
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Failed to delete package.');
                }

                alert('Pass package deleted successfully!');
                loadPackages();

            } catch (error) {
                alert(error.message);
            }
        }

        document.getElementById('packageForm')
            .addEventListener('submit', async function(event) {
                event.preventDefault();

                const pkg = {
                    name: document.getElementById('name').value.trim(),
                    hours: Number(document.getElementById('hours').value),
                    price: Number(document.getElementById('price').value),
                    validity_days: Number(document.getElementById('validity_days').value),
                    description: document.getElementById('description').value.trim()
                };

                if (!pkg.name || pkg.hours <= 0 ||
                    pkg.price <= 0 || !Number.isInteger(pkg.validity_days) ||
                    pkg.validity_days <= 0) {
                    alert('Please enter valid package information.');
                    return;
                }

                const url = editingPackageId
                    ? '/api/pass-packages/' + editingPackageId
                    : '/api/pass-packages';

                const method = editingPackageId ? 'PUT' : 'POST';

                try {
                    const res = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(pkg)
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.message || 'Unable to save package.');
                    }

                    alert(editingPackageId
                        ? 'Package updated successfully!'
                        : 'Package created successfully!');

                    editingPackageId = null;
                    document.getElementById('packageForm').reset();

                    document.querySelector('#packageForm button[type="submit"]')
                        .textContent = 'Save Package';

                    loadPackages();

                } catch (error) {
                    alert(error.message);
                }
            });

        loadPackages();
    </script>
</body>
</html>
