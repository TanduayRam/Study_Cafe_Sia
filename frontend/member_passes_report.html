<!DOCTYPE html>
<html>
<head>
    <title>Member Passes Report</title>
</head>
<body>
    <h2>Member Passes Report</h2>

    <p id="status">Loading member passes...</p>

    <table border="1">
        <thead>
            <tr>
                <th>Member Pass ID</th>
                <th>Member ID</th>
                <th>Member Name</th>
                <th>Package Name</th>
                <th>Package Hours</th>
                <th>Package Price</th>
                <th>Remaining Hours</th>
                <th>Expiration Date</th>
                <th>Date Assigned</th>
            </tr>
        </thead>

        <tbody id="reportList"></tbody>
    </table>

    <script>
        async function loadMemberPasses() {
            const status = document.getElementById('status');
            const list = document.getElementById('reportList');

            status.textContent = 'Loading member passes...';

            try {
                const res = await fetch('/api/reports/member-passes');

                if (!res.ok) {
                    throw new Error('Failed to retrieve member passes report.');
                }

                const response = await res.json();
                const passes = response.data;

                list.innerHTML = passes.map(pass => `
                    <tr>
                        <td>${pass.member_pass_id}</td>
                        <td>${pass.user_id}</td>
                        <td>${pass.member_name}</td>
                        <td>${pass.package_name}</td>
                        <td>${pass.package_hours}</td>
                        <td>₱${Number(pass.package_price).toFixed(2)}</td>
                        <td>${pass.remaining_hours}</td>
                        <td>${new Date(pass.expires_on).toLocaleDateString()}</td>
                        <td>${new Date(pass.created_at).toLocaleDateString()}</td>
                    </tr>
                `).join('');

                status.textContent =
                    `Member passes loaded successfully! Total records: ${response.count}`;

            } catch (error) {
                status.textContent = error.message;
            }
        }

        loadMemberPasses();
    </script>
</body>
</html>
